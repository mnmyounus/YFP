name: Build Debug APK

# Triggers on both tag pushes AND manual button trigger in GitHub Actions UI
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build and package debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract version or build name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${RAW_TAG#v}"
          else
            RAW_TAG="dev-${GITHUB_SHA:~0,7}"
            VERSION_NAME="debug-${GITHUB_SHA:~0,7}"
          fi
          echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found under app/build/outputs/apk/debug — build failed."
            exit 1
          fi
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Rename APK for artifact
        id: rename
        run: |
          DEST="YFP-${{ steps.version.outputs.version_name }}.apk"
          cp "${{ steps.apk.outputs.path }}" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      # Uploads APK directly to the Actions run summary page for instant download
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YFP-debug-apk
          path: ${{ steps.rename.outputs.path }}

      # Creates GitHub Release ONLY when triggered by a tag or when 'create_release' is checked
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_tag }}
          name: "YFP ${{ steps.version.outputs.raw_tag }} (Debug)"
          body: |
            Automated debug build of YFP (Your Files Protector) by MNM Younus.
          files: ${{ steps.rename.outputs.path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.raw_tag, '-') }}
