name: Build and Release Debug APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract version name from tag
        id: version
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${RAW_TAG#v}"
          echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found under app/build/outputs/apk/debug — build failed."
            exit 1
          fi
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release asset
        id: rename
        run: |
          DEST="YFP-${{ steps.version.outputs.version_name }}-debug.apk"
          cp "${{ steps.apk.outputs.path }}" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_tag }}
          name: "YFP ${{ steps.version.outputs.raw_tag }} (Debug)"
          body: |
            Automated debug release build of YFP (Your Files Protector) by MNM Younus.

            *Note: This is a debug build intended for testing.*
          files: ${{ steps.rename.outputs.path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.raw_tag, '-') }}
